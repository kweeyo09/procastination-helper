<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,600&family=Courier+Prime:wght@400;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Warm glow from above -->
  <div class="lamp-glow" id="lamp-glow"></div>

  <!-- Header -->
  <header>
    <div class="brand">
      <span class="brand-glyph">✦</span>
      <span class="brand-name">FocusNest</span>
    </div>
  </header>

  <!-- Main -->
  <main>

    <section class="hero">
      <h1>What are we <em>actually</em><br>doing today?</h1>
      <p class="sub">Type one big task. I'll split it into steps so small<br>you'll almost feel silly for having dreaded it.</p>
    </section>

    <div class="input-group">
      <textarea
        id="task-input"
        placeholder="e.g. Write my essay introduction..."
        rows="2"
        aria-label="Task to break down"
      ></textarea>
      <div class="btn-row">
        <button id="breakdown-btn">Break it down ✦</button>
        <p class="ai-nudge" id="ai-nudge">
          <button class="ai-enable-btn" id="ai-enable-btn">✦ Enable local AI — smarter, ~480 MB one-time</button>
        </p>
      </div>
    </div>

    <!-- AI download status -->
    <div class="ai-status hidden" id="ai-status">
      <span class="ai-status-text" id="ai-status-text">Downloading model…</span>
      <div class="ai-track">
        <div class="ai-fill" id="ai-progress-fill"></div>
      </div>
    </div>

    <!-- Progress bar (hidden until steps exist) -->
    <div class="progress-row hidden" id="progress-row">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-count" id="progress-count">0 / 0</span>
    </div>

    <!-- Loading state -->
    <div class="loading hidden" id="loading">
      <div class="dots"><span></span><span></span><span></span></div>
      <p class="loading-text" id="loading-text">Making it manageable...</p>
    </div>

    <!-- Steps list -->
    <ol class="steps" id="steps" aria-label="Task steps"></ol>

    <!-- All done -->
    <div class="done-state hidden" id="done-state">
      <p class="done-headline">✦ You did it. ✦</p>
      <p class="done-sub">All steps complete. Take a breath.</p>
      <button class="ghost-btn" id="reset-btn">Start a new task →</button>
    </div>

  </main>

  <!-- Toast / encouragement -->
  <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
